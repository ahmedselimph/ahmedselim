<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmed Selim Photography</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f1;--card:#ffffff;--text:#2b2623;--muted:#8a7f77;--accent:#b08968;--border:#eadfd4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1613;--card:#26201c;--text:#f3ece5;--muted:#a89c92;--accent:#d2a679;--border:#3a312b}}
:root[data-theme="dark"]{--bg:#1a1613;--card:#26201c;--text:#f3ece5;--muted:#a89c92;--accent:#d2a679;--border:#3a312b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;min-height:100vh}
.cover{width:100%;max-width:520px;margin:0 auto;aspect-ratio:1000/645;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 66%,transparent 100%);mask-image:linear-gradient(to bottom,#000 66%,transparent 100%)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.wrap{max-width:460px;margin:0 auto;padding:0 18px 40px;text-align:center}
.avatar{display:block;width:118px;height:118px;border-radius:50%;object-fit:cover;margin:-62px auto 12px;position:relative;border:3px solid var(--accent);background:var(--bg);box-shadow:0 4px 16px rgba(0,0,0,.25)}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.3px;position:relative}
.sub{color:var(--muted);font-size:14px;margin:0 0 26px}
a.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--border);color:var(--text);text-decoration:none;padding:15px 18px;border-radius:14px;margin-bottom:12px;font-weight:600;font-size:16px}
a.btn:active{transform:scale(.98)}
a.btn small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;direction:ltr;text-align:right}
a.btn .ic{font-size:22px;color:var(--accent);display:flex}
a.btn .t{flex:1;text-align:right}
a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
a.primary small{color:#fff;opacity:.9}
a.primary .ic{color:#fff}
div.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px dashed var(--accent);padding:15px 18px;border-radius:14px;margin-bottom:12px;font-weight:600;font-size:16px;cursor:pointer}
div.btn small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;direction:ltr;text-align:right}
div.btn .ic{font-size:22px;color:var(--accent);display:flex}.ic svg{width:27px;height:27px;display:block}div.btn .t{flex:1;text-align:right}
.cp{font-size:12px;color:var(--accent);font-weight:600}
.foot{margin-top:22px;color:var(--muted);font-size:12.5px}
</style>
</head>
